steps:
  - name: 'node:22'
    dir: 'frontend-react'
    entrypoint: npm
    args: ['install']

  - name: 'node:22'
    dir: 'frontend-react'
    entrypoint: npm
    args: ['run', 'build']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'frontend-react'
    args: ['gcloud', 'app', 'deploy', '--quiet']

timeout: '1600s'

options:
  logging: CLOUD_LOGGING_ONLY